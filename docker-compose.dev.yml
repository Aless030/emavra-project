version: '3.8'

services:
  # ==================
  # BACKEND - PHP-FPM (Laravel)
  # ==================
  backend:
    build:
      context: ./emavra-backend
      dockerfile: Dockerfile
    container_name: emavra-backend-prod
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./emavra-backend:/var/www
      - backend_storage:/var/www/storage
      - backend_cache:/var/www/bootstrap/cache
      - backend_vendor:/var/www/vendor
    environment:
      # PostgreSQL REMOTO (192.168.104.201)
      - DB_CONNECTION=pgsql
      - DB_HOST=192.168.104.201
      - DB_PORT=5432
      - DB_DATABASE=emavraforestaldb_dev
      - DB_USERNAME=emavraforestal_user
      - DB_PASSWORD=emavraforestal_pass
      
      # App Settings
      - APP_NAME=EMAVRA
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://192.168.104.201:8001
      - APP_KEY=base64:efdnbli2ujgcV4JEgrdhFo3eP1nUpBhGrzy7CCj3MfA=
      
      # Frontend URL para CORS
      - FRONTEND_URL=http://192.168.104.201:8002
      - SANCTUM_STATEFUL_DOMAINS=192.168.104.201:8002
      - SESSION_DOMAIN=.192.168.104.201
      
      # Storage
      - FILESYSTEM_DISK=public
    networks:
      - emavra_network

  # ==================
  # NGINX - Servidor web para Laravel (Puerto 8001)
  # ==================
  nginx:
    image: nginx:alpine
    container_name: emavra-nginx-prod
    restart: unless-stopped
    ports:
      - "8001:80"  # Puerto externo:interno
    volumes:
      - ./emavra-backend:/var/www
      - ./emavra-backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - backend_storage:/var/www/storage
    depends_on:
      - backend
    networks:
      - emavra_network

  # ==================
  # FRONTEND - React (Puerto 8002)
  # ==================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - REACT_APP_API_URL=http://192.168.104.201:8001/api
        - REACT_APP_STORAGE_URL=http://192.168.104.201:8001/storage
        - REACT_APP_MAPBOX_TOKEN=pk.eyJ1IjoiYWxlc3NpcyIsImEiOiJjbGcxbHBtbHQwdDU5M2RubDFodjY3a2x0In0.NXe43GdM4PJBj7ow0Dnkpw
    container_name: emavra-frontend-prod
    restart: unless-stopped
    ports:
      - "8002:80"  # Cambiado de 8002:8002 a 8002:80
    depends_on:
      - nginx
    networks:
      - emavra_network

networks:
  emavra_network:
    driver: bridge

volumes:
  backend_storage:
    driver: local
  backend_cache:
    driver: local
  backend_vendor:
    driver: local