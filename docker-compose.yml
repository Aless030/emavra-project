version: '3.8'

services:
  # PostgreSQL con PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: emavra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emavraforestaldb_dev
      POSTGRES_USER: emavraforestal_user
      POSTGRES_PASSWORD: emavraforestal_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - emavra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emavraforestal_user -d emavraforestaldb_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Laravel + PHP-FPM
  backend:
    build:
      context: ./emavra-backend
      dockerfile: Dockerfile
    container_name: emavra_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./emavra-backend:/var/www
      - backend_storage:/var/www/storage
      - backend_cache:/var/www/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emavra_network
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=emavraforestaldb_dev
      - DB_USERNAME=emavraforestal_user
      - DB_PASSWORD=emavraforestal_pass

  # Nginx (servidor web para Laravel)
  nginx:
    image: nginx:alpine
    container_name: emavra_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./emavra-backend:/var/www
      - ./emavra-backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - backend_storage:/var/www/storage
    depends_on:
      - backend
    networks:
      - emavra_network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emavra_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8001/api
      - REACT_APP_STORAGE_URL=http://localhost:8001/storage
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    networks:
      - emavra_network
    depends_on:
      - nginx

networks:
  emavra_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local
  backend_cache:
    driver: local