server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Configuración de tamaños de archivos
    client_max_body_size 10M;

    # Logs
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Manejar preflight requests OPTIONS
    location / {
        if ($request_method = 'OPTIONS') {
            # Se eliminaron las directivas add_header de CORS aquí.
            # Laravel se encargará de establecer los encabezados en la respuesta final.
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Se eliminaron las directivas add_header de CORS aquí.
        # Nginx solo debe actuar como proxy.
        
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Se eliminaron las directivas add_header de CORS aquí.
        
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Servir archivos estáticos (storage)
    location /storage {
        alias /var/www/storage/app/public;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Opcional: Puedes dejar el CORS aquí si quieres servir archivos estáticos con el encabezado.
        # Si tienes problemas, déjalo, pero si deseas que sea 100% Laravel, coméntalo.
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always; 
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}